name: Informe de error (Bug)
description: Reportar un comportamiento incorrecto o fallo en la aplicación
labels: ["bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción del error
      description: Explica de forma clara qué está ocurriendo y qué debería ocurrir.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      description: Indica los pasos exactos para reproducir el problema.
      placeholder: |
        1. Ir a '...'
        2. Hacer clic en '...'
        3. Observar el error
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación para el cierre
      description: Condiciones verificables que deben cumplirse para dar el error por resuelto.
    validations:
      required: true
